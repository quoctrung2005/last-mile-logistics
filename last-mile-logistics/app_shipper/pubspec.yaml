name: app_shipper
description: "Ứng dụng shipper cho nền tảng quản lý giao hàng chặng cuối."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_map: 8.3.2
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  google_fonts: ^9.0.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: 0.9.1
  mobile_scanner: 7.4.2
  shared_preferences: ^2.5.6
  signalr_netcore: ^1.4.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
